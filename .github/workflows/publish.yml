name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - name: Verify build artifacts
        run: |
          test -f lib/index.js
          test -f lib/invariant.js
          test -f lib/client.js
          test -d lib/types
          echo "✓ lib/index.js, lib/invariant.js, lib/client.js, lib/types/ all present"

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
